name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # 配色取自 3901646.xyz：日间为纸色与橄榄绿、印章红；夜间为墨色与金色
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a84232&color_dots=#ebe8dc,#d9dcc5,#b6baa3,#8d997b,#596343
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e5cfb3&color_dots=#1c1f19,#34372c,#5d5a45,#8f7d5c,#c5a47a

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
