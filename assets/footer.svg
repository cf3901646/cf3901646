<svg width="960" height="56" viewBox="0 0 960 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Iridescent Ribbon Gradient -->
    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="footerSoftGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="centerSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Light Streak -->
  <line x1="80" y1="20" x2="880" y2="20" stroke="url(#footerLineGrad)" stroke-width="1.8" filter="url(#footerSoftGlow)"/>

  <!-- Center Apple WWDC / Antigravity Sparkle Emblem -->
  <g transform="translate(480, 20)" filter="url(#emblemShadow)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M0 -7 Q0 0 -7 0 Q0 0 0 7 Q0 0 7 0 Q0 0 0 -7 Z" fill="url(#centerSparkleGrad)"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Micro Footer Text -->
  <text x="480" y="44" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.8">
    ENGINEERED WITH CURIOSITY &amp; PRECISION • BEIJING &amp; REMOTE WORLDWIDE
  </text>
</svg>