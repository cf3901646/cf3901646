<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="44" viewBox="0 0 960 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-stop Apple WWDC & Google Antigravity Iridescent Gradient -->
    <linearGradient id="taglineBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- WWDC Sparkle Star Gradient -->
    <linearGradient id="taglineSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Frosted Pill Shadow -->
    <filter id="pillGlow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <style>
      .msg-1 { animation: cycleText1 16s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .msg-2 { animation: cycleText2 16s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .msg-3 { animation: cycleText3 16s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .msg-4 { animation: cycleText4 16s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

      @keyframes cycleText1 {
        0%, 21%   { opacity: 1; transform: translateY(0px); }
        25%, 96%  { opacity: 0; transform: translateY(-4px); }
        100%      { opacity: 1; transform: translateY(0px); }
      }
      @keyframes cycleText2 {
        0%, 21%   { opacity: 0; transform: translateY(4px); }
        25%, 46%  { opacity: 1; transform: translateY(0px); }
        50%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycleText3 {
        0%, 46%   { opacity: 0; transform: translateY(4px); }
        50%, 71%  { opacity: 1; transform: translateY(0px); }
        75%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycleText4 {
        0%, 71%   { opacity: 0; transform: translateY(4px); }
        75%, 96%  { opacity: 1; transform: translateY(0px); }
        100%      { opacity: 0; transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Frosted Glass Pill Capsule -->
  <g filter="url(#pillGlow)">
    <rect x="50" y="4" width="860" height="36" rx="18" fill="#ffffff" fill-opacity="0.94" stroke="url(#taglineBorderGrad)" stroke-width="1.2"/>
    <rect x="51" y="5" width="858" height="34" rx="17" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7"/>
  </g>

  <!-- Left Apple Intelligence Sparkle Star -->
  <g transform="translate(68, 12)">
    <path d="M10 1 Q10 10 1 10 Q10 10 10 19 Q10 10 19 10 Q10 10 10 1 Z" fill="url(#taglineSparkle)"/>
    <circle cx="10" cy="10" r="2" fill="#ffffff"/>
  </g>

  <!-- Rotating Keynote Presentation Statements (Accessible & Crisp) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <!-- Message 1 -->
    <text class="msg-1" x="480" y="27" fill="#0f172a">
      Architecting high-impact developer tools &amp; autonomous agentic systems
    </text>

    <!-- Message 2 -->
    <text class="msg-2" x="480" y="27" fill="#0f172a">
      51+ Upstream PRs across Tornado, Pydantic, Cookiecutter &amp; Turborepo
    </text>

    <!-- Message 3 -->
    <text class="msg-3" x="480" y="27" fill="#0f172a">
      Crafting fluid zero-gravity interfaces, typed runtimes &amp; developer ergonomics
    </text>

    <!-- Message 4 -->
    <text class="msg-4" x="480" y="27" fill="#0f172a">
      Bridging spatial GIS computing with multi-agent urban simulation
    </text>
  </g>

  <!-- Right Sparkle Star (Balanced Framing) -->
  <g transform="translate(872, 12)">
    <path d="M10 1 Q10 10 1 10 Q10 10 10 19 Q10 10 19 10 Q10 10 10 1 Z" fill="url(#taglineSparkle)"/>
    <circle cx="10" cy="10" r="2" fill="#ffffff"/>
  </g>
</svg>
