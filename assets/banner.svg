<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Neon Cyan Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base Card with Rounded Corners -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#grid)"/>

  <!-- Radial Glow Behind Title -->
  <circle cx="450" cy="90" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glowCyan)"/>
  <circle cx="700" cy="140" r="120" fill="#818cf8" opacity="0.06"/>

  <!-- Border Outline -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.75" opacity="0.85"/>

  <!-- Terminal Window Controls (Top-Left) -->
  <circle cx="32" cy="26" r="5" fill="#ef4444" opacity="0.9"/>
  <circle cx="48" cy="26" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="64" cy="26" r="5" fill="#10b981" opacity="0.9"/>
  
  <text x="86" y="30" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
    cf3901646://portfolio-core
  </text>

  <!-- Status Pulse (Top-Right) -->
  <circle cx="830" cy="26" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="842" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
    ONLINE
  </text>

  <!-- Main Name Title -->
  <text x="450" y="96" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="2">
    CHARLIE FREEMAN
  </text>

  <!-- Tagline / Code Line -->
  <g transform="translate(450, 128)">
    <text text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="14.5" font-weight="500" letter-spacing="0.5">
      <tspan fill="#38bdf8">&gt; const</tspan> developer = { role: <tspan fill="#a7f3d0">"Full-Stack &amp; Systems"</tspan>, focus: <tspan fill="#fbcfe8">["AI Agents", "DevTools"]</tspan> };
    </text>
  </g>

  <!-- Interactive / Highlight Badges Pill Row -->
  <g transform="translate(80, 168)">
    <!-- Pill 1: 51+ PRs -->
    <g transform="translate(0, 0)">
      <rect width="160" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/>
      <circle cx="20" cy="17" r="4" fill="#818cf8"/>
      <text x="32" y="22" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        ⚡ 51+ Open PRs
      </text>
    </g>

    <!-- Pill 2: Haidian AI Urban -->
    <g transform="translate(175, 0)">
      <rect width="185" height="34" rx="17" fill="#0f291e" stroke="#10b981" stroke-width="1.2" opacity="0.9"/>
      <circle cx="20" cy="17" r="4" fill="#34d399"/>
      <text x="32" y="22" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🚄 Jingzhang Rising
      </text>
    </g>

    <!-- Pill 3: EasyCV Builder -->
    <g transform="translate(375, 0)">
      <rect width="175" height="34" rx="17" fill="#172554" stroke="#3b82f6" stroke-width="1.2" opacity="0.9"/>
      <circle cx="20" cy="17" r="4" fill="#60a5fa"/>
      <text x="32" y="22" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        📝 EasyCV Builder
      </text>
    </g>

    <!-- Pill 4: AI Coding Arena -->
    <g transform="translate(565, 0)">
      <rect width="175" height="34" rx="17" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" opacity="0.9"/>
      <circle cx="20" cy="17" r="4" fill="#c084fc"/>
      <text x="32" y="22" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        ⚔️ AI Coding Arena
      </text>
    </g>
  </g>
</svg>